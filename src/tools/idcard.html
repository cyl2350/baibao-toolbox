<div class="field">
  <label for="idc-in">输入 18 位身份证号码</label>
  <input type="text" id="idc-in" placeholder="如 110105199003071234" maxlength="18" />
</div>
<div class="field-row">
  <button class="btn" id="idc-run">校验</button>
</div>
<div class="result-box" id="idc-out" style="margin-top:14px;white-space:normal">输入身份证号码后点击校验</div>
<p class="tip">校验码按国家标准 GB 11643-1999 计算;归属地只判断到省级代码(前 2 位),不涉及任何个人数据存储。</p>
