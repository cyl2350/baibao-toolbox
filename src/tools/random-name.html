<div class="field-row">
  <div class="field" style="flex:1;min-width:130px">
    <label for="rn-surname">姓氏</label>
    <select id="rn-surname"><option value="">(随机百家姓)</option></select>
  </div>
  <div class="field" style="flex:1;min-width:130px">
    <label for="rn-gender">风格</label>
    <select id="rn-gender">
      <option value="m">偏男孩名</option>
      <option value="f">偏女孩名</option>
      <option value="n">中性</option>
    </select>
  </div>
  <div class="field" style="flex:1;min-width:130px">
    <label for="rn-style">名字类型</label>
    <select id="rn-style">
      <option value="both" selected>单双字混合</option>
      <option value="single">单字名</option>
      <option value="double">双字名</option>
    </select>
  </div>
  <div class="field" style="flex:1;min-width:100px">
    <label for="rn-count">生成数量</label>
    <input type="number" id="rn-count" value="10" min="1" max="30" />
  </div>
</div>
<div class="field-row">
  <button class="btn" id="rn-run">生成名字</button>
</div>
<div class="result-box" id="rn-out" style="margin-top:14px;white-space:normal;font-size:18px">点击「生成名字」</div>
<p class="tip">字库为常用吉祥字集合,仅供参考与灵感;正式取名建议结合生辰与家族字辈。</p>
