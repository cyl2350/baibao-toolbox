<div class="field-row">
  <div class="field" style="flex:1;min-width:130px">
    <label for="bmi-height">身高(cm)</label>
    <input type="number" id="bmi-height" value="170" min="50" max="250" />
  </div>
  <div class="field" style="flex:1;min-width:130px">
    <label for="bmi-weight">体重(kg)</label>
    <input type="number" id="bmi-weight" value="65" min="10" max="300" step="0.5" />
  </div>
</div>
<div class="field-row">
  <button class="btn" id="bmi-run">计算 BMI</button>
</div>
<div class="result-box" id="bmi-out" style="margin-top:14px;white-space:normal">输入身高体重后点击计算</div>
<p class="tip">采用中国成人 BMI 标准:&lt;18.5 偏瘦 · 18.5~23.9 正常 · 24~27.9 超重 · ≥28 肥胖。仅供参考,不构成医学建议。</p>
