<div class="field-row">
  <div class="field" style="flex:1;min-width:130px">
    <label for="mt-amount">贷款金额(万元)</label>
    <input type="number" id="mt-amount" value="100" min="0" step="1" />
  </div>
  <div class="field" style="flex:1;min-width:130px">
    <label for="mt-rate">年利率(%)</label>
    <input type="number" id="mt-rate" value="3.6" min="0" step="0.05" />
  </div>
  <div class="field" style="flex:1;min-width:130px">
    <label for="mt-years">贷款年限(年)</label>
    <input type="number" id="mt-years" value="30" min="1" max="50" />
  </div>
  <div class="field" style="flex:1;min-width:130px">
    <label for="mt-method">还款方式</label>
    <select id="mt-method">
      <option value="equal">等额本息</option>
      <option value="principal">等额本金</option>
    </select>
  </div>
</div>
<div class="field-row">
  <button class="btn" id="mt-run">计算月供</button>
</div>
<div class="result-box" id="mt-out" style="margin-top:14px;white-space:normal">输入参数后点击计算</div>
<div class="field" style="margin-top:16px">
  <label>还款明细(前 24 期)</label>
  <div style="max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:8px">
    <table id="mt-table" style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="background:var(--bg)"><th style="padding:6px 8px;text-align:left">期数</th><th style="padding:6px 8px;text-align:right">月供(元)</th><th style="padding:6px 8px;text-align:right">本金(元)</th><th style="padding:6px 8px;text-align:right">利息(元)</th><th style="padding:6px 8px;text-align:right">剩余本金(元)</th></tr></thead>
      <tbody id="mt-tbody"></tbody>
    </table>
  </div>
</div>
<p class="tip">按「贷款本金 × 月利率」复利计算,结果仅供参考,实际以银行审批为准。</p>
