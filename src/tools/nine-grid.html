<div class="field">
  <label for="ng-file">选择图片(建议正方形,效果最佳)</label>
  <input type="file" id="ng-file" accept="image/*" />
</div>
<div class="field-row">
  <button class="btn" id="ng-split">🔲 切成九宫格</button>
  <button class="btn secondary" id="ng-grid">👁 拼图预览</button>
  <button class="btn secondary" id="ng-download">💾 打包下载 9 张</button>
</div>
<div class="result-box" id="ng-out" style="margin-top:14px;white-space:normal">选择图片后点击「切成九宫格」</div>
<p class="tip">切图会保留原图比例居中裁剪为正方形;每张可单独右键保存,或打包下载。全程本地处理。</p>
