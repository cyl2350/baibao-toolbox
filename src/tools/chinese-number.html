<div class="field">
  <label for="cn-in">输入数字(支持小数与负数)</label>
  <input type="text" id="cn-in" value="1234.56" placeholder="如 1234.56" />
</div>
<div class="field-row">
  <button class="btn" id="cn-run">转换为中文</button>
  <button class="btn secondary" id="cn-copy">复制</button>
</div>
<div class="result-box" id="cn-out" style="margin-top:14px;white-space:normal;font-size:18px">输入数字后点击转换</div>
<p class="tip">读法示例:1234 → 一千二百三十四;10005 → 一万零五;0.5 → 零点五;金额大写请用<a href="../rmb-upper/">人民币大写转换</a>。</p>
