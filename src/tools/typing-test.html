<div class="field">
  <label for="tt-mode">测试模式</label>
  <select id="tt-mode">
    <option value="cn">中文打字</option>
    <option value="en">英文打字</option>
  </select>
</div>
<div class="result-box" id="tt-sample" style="white-space:normal;min-height:60px;font-size:15px"></div>
<div class="field" style="margin-top:12px">
  <label for="tt-input">在这里输入(自动开始计时)</label>
  <textarea id="tt-input" style="min-height:90px" placeholder="点击这里开始打字……"></textarea>
</div>
<div class="field-row">
  <button class="btn secondary" id="tt-restart">重新开始</button>
</div>
<div class="result-box" id="tt-result" style="margin-top:12px;white-space:normal">打字结束后显示成绩</div>
<p class="tip">中文按「字/分钟」统计,英文按「单词/分钟(WPM)」统计;支持任意输入法。</p>
