<div class="field-row">
  <div class="field" style="flex:1;min-width:120px">
    <label for="av-style">风格</label>
    <select id="av-style">
      <option value="geo">几何图案</option>
      <option value="waves">波纹线条</option>
      <option value="dots">圆点阵列</option>
    </select>
  </div>
  <div class="field" style="flex:1;min-width:110px">
    <label for="av-size">尺寸(px)</label>
    <select id="av-size">
      <option value="256">256</option>
      <option value="512" selected>512</option>
      <option value="1024">1024</option>
    </select>
  </div>
  <div class="field" style="flex:1;min-width:120px">
    <label for="av-letter">首字母(可选)</label>
    <input type="text" id="av-letter" maxlength="1" placeholder="如 A" />
  </div>
</div>
<div class="field-row">
  <button class="btn" id="av-gen">🎲 生成</button>
  <button class="btn secondary" id="av-download">下载 PNG</button>
</div>
<div class="field" style="margin-top:14px;text-align:center">
  <canvas id="av-canvas" style="border-radius:20px;border:1px solid var(--border);max-width:100%"></canvas>
</div>
<p class="tip">每次生成都是独一无二的渐变头像;加首字母后更像「设计过的」头像。</p>
