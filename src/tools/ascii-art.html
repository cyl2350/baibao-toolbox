<div class="field">
  <label for="aa-file">选择图片</label>
  <input type="file" id="aa-file" accept="image/*" />
</div>
<div class="field-row">
  <div class="field" style="flex:1;min-width:120px">
    <label for="aa-width">输出宽度(字符)</label>
    <input type="number" id="aa-width" value="100" min="20" max="300" />
  </div>
  <div class="field" style="flex:1;min-width:130px">
    <label for="aa-chars">字符集</label>
    <select id="aa-chars">
      <option value="dense" selected>密集(@%#*+=-:. )</option>
      <option value="simple">简单(#*+.: )</option>
      <option value="block">方块(█▓▒░ )</option>
    </select>
  </div>
</div>
<div class="field-row">
  <button class="btn" id="aa-run">生成字符画</button>
  <button class="btn secondary" id="aa-copy">复制</button>
</div>
<div class="result-box" id="aa-out" style="margin-top:14px;white-space:pre;max-height:420px;overflow:auto;font-size:9px;line-height:1.1"></div>
<p class="tip">把图片亮度映射为字符:暗→密集字符,亮→空格。深色图片效果最佳。复制后可粘贴到任意文本或代码里。</p>
