<div class="field-row">
  <div class="field" style="flex:1;min-width:110px">
    <label for="ci-principal">初始本金(元)</label>
    <input type="number" id="ci-principal" value="10000" min="0" step="1000" />
  </div>
  <div class="field" style="flex:1;min-width:110px">
    <label for="ci-rate">年利率(%)</label>
    <input type="number" id="ci-rate" value="5" min="0" step="0.1" />
  </div>
  <div class="field" style="flex:1;min-width:110px">
    <label for="ci-years">投资年数</label>
    <input type="number" id="ci-years" value="10" min="1" max="60" />
  </div>
  <div class="field" style="flex:1;min-width:120px">
    <label for="ci-annual">每年追加(元,0=不追加)</label>
    <input type="number" id="ci-annual" value="12000" min="0" step="1000" />
  </div>
</div>
<div class="field-row">
  <button class="btn" id="ci-run">计算</button>
</div>
<div class="result-box" id="ci-out" style="margin-top:14px;white-space:normal">输入参数后点击计算</div>
<div class="field" style="margin-top:14px">
  <label>逐年明细(前 15 年)</label>
  <div style="max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:8px">
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="background:var(--bg)"><th style="padding:6px 8px;text-align:left">年份</th><th style="padding:6px 8px;text-align:right">年末总额(元)</th><th style="padding:6px 8px;text-align:right">累计投入(元)</th><th style="padding:6px 8px;text-align:right">收益(元)</th></tr></thead>
      <tbody id="ci-tbody"></tbody>
    </table>
  </div>
</div>
<p class="tip">按每年复利一次计算:终值 = 本金×(1+r)^n + 每年追加×((1+r)^n-1)/r。不构成投资建议。</p>
