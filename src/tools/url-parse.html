<div class="field">
  <label for="up-in">输入网址</label>
  <input type="text" id="up-in" placeholder="https://example.com:8080/path/to?name=张三&page=2#section" value="https://example.com:8080/path/to?name=张三&page=2#section" />
</div>
<div class="field-row">
  <button class="btn" id="up-run">解析</button>
  <button class="btn secondary" id="up-copy">复制结果</button>
</div>
<div class="result-box" id="up-out" style="margin-top:14px;white-space:normal">输入网址后点击解析</div>
<p class="tip">使用浏览器原生 URL 解析,支持任意合法网址;查询参数以表格展示并自动 URL 解码。</p>
