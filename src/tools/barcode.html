<div class="field">
  <label for="bc-value">条形码内容</label>
  <input type="text" id="bc-value" value="6901234567892" placeholder="如 EAN-13 商品码或任意文本(CODE128)" />
</div>
<div class="field-row">
  <div class="field" style="flex:1;min-width:120px">
    <label for="bc-format">格式</label>
    <select id="bc-format">
      <option value="EAN13">EAN-13(商品码)</option>
      <option value="EAN8">EAN-8(短商品码)</option>
      <option value="CODE128" selected>CODE128(通用)</option>
      <option value="CODE39">CODE39(字母数字)</option>
      <option value="UPC">UPC(北美商品码)</option>
    </select>
  </div>
  <div class="field" style="flex:1;min-width:110px">
    <label for="bc-height">高度(px)</label>
    <input type="number" id="bc-height" value="80" min="30" max="200" />
  </div>
</div>
<div class="field">
  <label><input type="checkbox" id="bc-text" checked /> 显示下方数字</label>
</div>
<div class="field-row">
  <button class="btn" id="bc-gen">生成条形码</button>
  <button class="btn secondary" id="bc-download">下载 PNG</button>
</div>
<div class="field" style="margin-top:14px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px">
  <svg id="bc-svg"></svg>
</div>
<p class="tip">EAN-13 需 12 位数字(第 13 位校验位自动补);UPC 需 11 位。生成在浏览器本地完成。</p>
