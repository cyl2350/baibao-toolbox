<div class="field-row">
  <div class="field" style="flex:1;min-width:180px">
    <label for="age-birth">出生日期</label>
    <input type="date" id="age-birth" value="1995-06-15" />
  </div>
</div>
<div class="field-row">
  <button class="btn" id="age-run">计算年龄</button>
</div>
<div class="result-box" id="age-out" style="margin-top:14px;white-space:normal">选择出生日期后点击计算</div>
<p class="tip">周岁按公历精确计算;虚岁为「当前公历年 - 出生年 + 1」的传统算法。</p>
