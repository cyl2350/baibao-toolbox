<div class="field-row">
  <div class="field" style="flex:1;min-width:130px">
    <label for="di-principal">本金(元)</label>
    <input type="number" id="di-principal" value="100000" min="0" step="1000" />
  </div>
  <div class="field" style="flex:1;min-width:130px">
    <label for="di-rate">年利率(%)</label>
    <input type="number" id="di-rate" value="2.5" min="0" step="0.05" />
  </div>
  <div class="field" style="flex:1;min-width:130px">
    <label for="di-years">存期(年)</label>
    <input type="number" id="di-years" value="3" min="1" max="30" />
  </div>
</div>
<div class="field-row">
  <button class="btn" id="di-run">计算利息</button>
  <button class="btn secondary" id="di-demo">填个示例</button>
</div>
<div class="result-box" id="di-out" style="margin-top:14px;white-space:normal">输入参数后点击计算</div>
<p class="tip">单利=整存整取到期一次付息;复利=每年到期转存(利滚利)。利率以银行当期挂牌为准。</p>
