<div class="field-row">
  <div class="field" style="flex:1;min-width:120px">
    <label for="pw-len">密码长度</label>
    <input type="number" id="pw-len" value="16" min="4" max="128" />
  </div>
</div>
<div class="field">
  <label>字符组合</label>
  <div class="field-row">
    <label style="font-size:13px"><input type="checkbox" id="pw-upper" checked /> 大写 A-Z</label>
    <label style="font-size:13px"><input type="checkbox" id="pw-lower" checked /> 小写 a-z</label>
    <label style="font-size:13px"><input type="checkbox" id="pw-digit" checked /> 数字 0-9</label>
    <label style="font-size:13px"><input type="checkbox" id="pw-symbol" checked /> 符号 !@#$%</label>
    <label style="font-size:13px"><input type="checkbox" id="pw-ambig" checked /> 排除易混淆(0O1lI)</label>
  </div>
</div>
<div class="field-row">
  <button class="btn" id="pw-gen">生成密码</button>
  <button class="btn secondary" id="pw-copy">复制</button>
</div>
<div class="result-box" id="pw-out" style="margin-top:14px;font-size:18px">密码将显示在这里</div>
<div id="pw-strength" class="tip"></div>
<p class="tip">使用浏览器密码学安全随机源 crypto.getRandomValues 生成,结果不会离开您的设备。</p>
