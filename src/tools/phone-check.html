<div class="field">
  <label for="ph-in">输入手机号(11 位)</label>
  <input type="text" id="ph-in" placeholder="如 13800138000" maxlength="11" />
</div>
<div class="field-row">
  <button class="btn" id="ph-run">校验</button>
  <button class="btn secondary" id="ph-demo">填个测试号</button>
</div>
<div class="result-box" id="ph-out" style="margin-top:14px;white-space:normal">输入手机号后点击校验</div>
<p class="tip">仅按公开号段规则判断格式与运营商,不查询任何个人数据;号段会随放号更新,仅供参考。</p>
