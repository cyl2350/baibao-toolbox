<div class="field">
  <label for="ip-in">输入 IP 地址(IPv4 或 IPv6)</label>
  <input type="text" id="ip-in" placeholder="如 192.168.1.1 或 2408:8207:4a80::1" />
</div>
<div class="field-row">
  <button class="btn" id="ip-run">校验</button>
  <button class="btn secondary" id="ip-demo">填个测试地址</button>
</div>
<div class="result-box" id="ip-out" style="margin-top:14px;white-space:normal">输入 IP 后点击校验</div>
<p class="tip">IPv4 分类按 RFC 5735;IPv6 按 RFC 4291。支持 IPv4 与十进制整数互转。</p>
