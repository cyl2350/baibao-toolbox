<div class="field" style="text-align:center;margin:14px 0">
  <div id="sw-display" style="font-size:60px;font-weight:800;font-family:ui-monospace,Consolas,monospace;letter-spacing:2px">00:00.0</div>
  <div id="sw-laps-count" class="tip" style="margin-top:4px">已计次 0 次</div>
</div>
<div class="field-row" style="justify-content:center">
  <button class="btn" id="sw-start">▶ 开始</button>
  <button class="btn secondary" id="sw-lap">计次</button>
  <button class="btn secondary" id="sw-reset">清零</button>
</div>
<div class="result-box" id="sw-laps" style="margin-top:14px;white-space:pre;max-height:220px">计次记录将显示在这里</div>
<p class="tip">毫秒精度,适合运动计时、实验计时与限时训练。刷新页面后数据清空。</p>
